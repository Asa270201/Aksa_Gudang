name: aksa_gudang
description: Aplikasi Monitoring Gudang APD, Alat Panen, dan Umum
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  google_fonts: ^6.2.1

  # Dashboard Charts
  fl_chart: ^1.0.0

  # Database
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.6
  path: ^1.9.1
  path_provider: ^2.1.5

  # Import Excel
  excel: ^4.0.6
  file_selector: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/